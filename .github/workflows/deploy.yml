name: Deploy EdgeRelay to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-edgerelay
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Console (Frontend)
        run: |
          cd console
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Install Root Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Backend & Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          printf "ENCRYPTION_KEY=%s\nSESSION_SECRET=%s\n" "$ENCRYPTION_KEY" "$SESSION_SECRET" > .secrets.env
          npx vite build
          node -e '
            const fs = require("fs");
            const p = "dist/ssr/wrangler.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            if (cfg.d1_databases) {
              cfg.d1_databases.forEach(d => {
                if (d.binding === "DB") {
                  d.database_name = "ai-gateway-mvp-db";
                  d.database_id = "33588f0d-1638-46cf-942c-25d146669930";
                }
              });
            }
            if (cfg.kv_namespaces) {
              cfg.kv_namespaces.forEach(k => {
                if (k.binding === "KV") {
                  k.id = "846871a31f4c4f0fb18c569861860130";
                }
              });
            }
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
            console.log("Injected production D1 and KV into dist/ssr/wrangler.json:", JSON.stringify(cfg, null, 2));
          '
          cp .secrets.env dist/ssr/.secrets.env
          cd dist/ssr
          npx wrangler deploy --secrets-file .secrets.env
